# Production host Nginx reverse proxy for Shuziren.
#
# Purpose:
# - Port 80 only redirects to HTTPS.
# - Port 443 terminates TLS, adds HSTS, then proxies to Docker web on 127.0.0.1:8080.
# - Docker web/api containers stay on private HTTP. Do not expose bearer-token traffic over public HTTP.
#
# Before using:
# 1. Point APP_DOMAIN DNS A record to the server IP.
# 2. Install nginx and certbot.
# 3. Replace APP_DOMAIN below with the real domain.
# 4. Ensure docker web is reachable locally: curl -I http://127.0.0.1:8080/
# 5. Test and reload: nginx -t && systemctl reload nginx

upstream shuziren_web_docker {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name APP_DOMAIN;

    # ACME HTTP-01 challenge path for certbot renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name APP_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/APP_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/APP_DOMAIN/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 600m;
    proxy_connect_timeout 60s;
    proxy_read_timeout 620s;
    proxy_send_timeout 620s;
    proxy_request_buffering off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Keep signed preview audio private while preserving Range/If-Range through
    # the host TLS proxy and the Docker web proxy.
    location ^~ /api/v1/tools/preview-audios/ {
        proxy_pass http://shuziren_web_docker;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_intercept_errors off;
    }

    location / {
        proxy_pass http://shuziren_web_docker;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_intercept_errors off;
    }
}
