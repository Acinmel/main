# 线上/内网一体化：Web（Nginx+静态）→ API（Nest + yt-dlp + ffmpeg + 外部 ASR）
# 使用：在项目根目录执行  docker compose up -d --build
# 访问：http://localhost:8080  （API 经同域 /api 反代，浏览器无需单独配后端地址）
#
# 数据：MySQL 8（用户 / 数字人元数据）；任务流水线仍为内存态（见 TasksService）。
# 口播转写：在 .env / backend/.env 配置 DASHSCOPE_API_KEY（见 backend/.env.example）。

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # 小内存 ECS 上 InnoDB 默认池较大易 OOM，进程被内核杀（容器 exit 137）→ unhealthy
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb_buffer_pool_size=64M
      - --performance_schema=OFF
      - --table_open_cache=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-koubo}
      MYSQL_USER: ${MYSQL_USER:-koubo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-koubo}
    volumes:
      - mysql_data:/var/lib/mysql
    # 宿主机端口；与本机已装的 MySQL 冲突时在根 .env 设 MYSQL_HOST_PORT=3307（api 仍连容器内 mysql:3306）
    ports:
      - '127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306'
    networks: [kb_net]
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  api:
    build:
      # 上下文为 backend/，Dockerfile 内 COPY package.json、DY-DOWNLOADER（勿用仓库根上下文 + COPY backend/...，否则在仅含 backend 的目录构建会 ENOENT）
      context: ./backend
      dockerfile: Dockerfile
      args:
        USE_CN_MIRROR: ${USE_CN_MIRROR:-1}
        APP_VERSION: ${APP_VERSION:-local}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME_UTC: ${BUILD_TIME_UTC:-unknown}
    restart: unless-stopped
    # 连接宿主机上的 MySQL 时：.env 中设 MYSQL_HOST=host.docker.internal，并注释掉本文件中的 mysql 服务及 api 对 mysql 的 depends_on
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # 根 .env 先，backend/.env 后（后加载覆盖同名键 → 仅写在 backend/.env 的 ARK 可覆盖根里空的 ARK_API_KEY=）
    # 模板勿含「ARK_API_KEY=」空赋值；若根 .env 仍有该行请删掉或填实值。
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: '3000'
      UPLOAD_DIR: ${UPLOAD_DIR:-/workspace/uploads}
      TEMP_DIR: ${TEMP_DIR:-/workspace/tmp}
      PUBLIC_UPLOAD_BASE_URL: ${PUBLIC_UPLOAD_BASE_URL:-http://localhost:8080/uploads}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      VOICE_PROVIDER_STREAM_SECRET: ${VOICE_PROVIDER_STREAM_SECRET:-}
      APP_VERSION: ${APP_VERSION:-local}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      BUILD_TIME_UTC: ${BUILD_TIME_UTC:-unknown}
      # 与下方 mysql 服务一致；使用宿主机 MySQL 时在 .env 中覆盖 MYSQL_HOST / 用户库名
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-koubo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-koubo}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-koubo}
      JWT_SECRET: ${JWT_SECRET:-}
      # 注册/登录 bcrypt 轮数；小内存 ECS 用 8 可降低 OOM 导致 Nginx 502
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-8}
      REGISTRATION_DEFAULT_ACCOUNT_STATUS: ${REGISTRATION_DEFAULT_ACCOUNT_STATUS:-pending}
      # Nginx 反代时识别 X-Forwarded-*（限流、审计等如需真实客户端 IP）
      TRUST_PROXY: '1'
      # 前后端分离部署时填写浏览器 Origin，逗号分隔；留空则与开发一致（origin: true）
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      YTDLP_BIN: /usr/local/bin/yt-dlp
      ASR_PYTHON_BIN: ${ASR_PYTHON_BIN:-python3}
      ASR_FUNASR_SCRIPT: ${ASR_FUNASR_SCRIPT:-/workspace/scripts/dashscope_funasr_transcribe.py}
      YTDLP_TIMEOUT_MS: '300000'
      # 抖音 Cookie 仅由根目录 env_file .env 注入（勿用 ${} 展开，避免值中含 $ 被 compose 误解析）
      DY_DOWNLOADER_FETCH_TIMEOUT_MS: ${DY_DOWNLOADER_FETCH_TIMEOUT_MS:-300000}
      # Linux 容器内落盘目录（与源码包内默认 Windows 路径无关）
      VIDEO_SAVE_DIR: ${VIDEO_SAVE_DIR:-/workspace/data/download-video}
      PREVIEW_VIDEO_SAVE_DIR: ${PREVIEW_VIDEO_SAVE_DIR:-/workspace/data/preview-videos}
      PREVIEW_AUDIO_SAVE_DIR: ${PREVIEW_AUDIO_SAVE_DIR:-/workspace/data/preview-audios}
      LIP_SYNC_PUBLIC_MEDIA_DIR: ${LIP_SYNC_PUBLIC_MEDIA_DIR:-/workspace/data/lip-sync-public}
      VOICE_SAMPLE_DIR: ${VOICE_SAMPLE_DIR:-/workspace/data/voice-samples}
      # 固定为镜像内 apt 安装的 ffmpeg；勿用 ${FFMPEG_BIN:-} — 宿主 .env 里 Windows 路径会误入容器导致「FFmpeg 不可用」
      FFMPEG_BIN: /usr/bin/ffmpeg
      FFPROBE_BIN: /usr/bin/ffprobe
      ENABLE_LEGACY_TOOLS_ENDPOINTS: ${ENABLE_LEGACY_TOOLS_ENDPOINTS:-false}
      ENABLE_LEGACY_TASKS_ENDPOINTS: ${ENABLE_LEGACY_TASKS_ENDPOINTS:-false}
      # 数字人形象落盘（与默认 data/digital-humans 一致，避免容器重建丢文件）
      DIGITAL_HUMAN_STORAGE_DIR: ${DIGITAL_HUMAN_STORAGE_DIR:-/workspace/data/digital-humans}
      USER_UPLOAD_RESOURCE_TTL_DAYS: ${USER_UPLOAD_RESOURCE_TTL_DAYS:-7}
      USER_UPLOAD_RESOURCE_CLEANUP_INTERVAL_MS: ${USER_UPLOAD_RESOURCE_CLEANUP_INTERVAL_MS:-3600000}
      # DASHSCOPE_API_KEY / ARK_API_KEY / OPENAI_API_KEY / ASR_* / SEEDREAM_* / DY_DOWNLOADER_COOKIE：
      # 写在根 .env 或 backend/.env（见上方 env_file）；勿在此用 ${VAR:-} 覆盖成空
    volumes:
      - uploads_data:/workspace/uploads
      - tmp_data:/workspace/tmp
      - video_downloads:/workspace/data/download-video
      - preview_videos:/workspace/data/preview-videos
      - preview_audios:/workspace/data/preview-audios
      - lip_sync_public:/workspace/data/lip-sync-public
      - voice_samples:/workspace/data/voice-samples
      - digital_human_storage:/workspace/data/digital-humans
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3000/api').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 90s
    networks: [kb_net]

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        USE_CN_MIRROR: ${USE_CN_MIRROR:-1}
    ports:
      - '${WEB_BIND_HOST:-0.0.0.0}:${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [kb_net]

volumes:
  mysql_data:
  uploads_data:
  tmp_data:
  video_downloads:
  preview_videos:
  preview_audios:
  lip_sync_public:
  voice_samples:
  digital_human_storage:

networks:
  kb_net:
    driver: bridge
